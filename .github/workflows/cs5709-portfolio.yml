name: CS5709 portfolio

on:
  push:
    paths:
      - '2026-27/SEM1/CS5709 - Software Engineering Evolution/Assignment 3/site/**'
      - '.github/workflows/cs5709-portfolio.yml'
  pull_request:
    paths:
      - '2026-27/SEM1/CS5709 - Software Engineering Evolution/Assignment 3/site/**'

permissions:
  contents: read

defaults:
  run:
    working-directory: '2026-27/SEM1/CS5709 - Software Engineering Evolution/Assignment 3/site'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '2026-27/SEM1/CS5709 - Software Engineering Evolution/Assignment 3/site/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src
      - id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: '2026-27/SEM1/CS5709 - Software Engineering Evolution/Assignment 3/site/dist'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
