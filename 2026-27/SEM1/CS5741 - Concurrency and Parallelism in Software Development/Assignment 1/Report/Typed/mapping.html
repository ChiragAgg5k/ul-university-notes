<p>In Java, mapping happens in two steps: we decide how blocks are assigned to threads, and the JVM and operating system decide how threads are placed on CPU cores.</p>
<figure class="diagram">
  <svg viewBox="0 0 560 150" width="100%" style="max-width:160mm" xmlns="http://www.w3.org/2000/svg" font-family="Georgia" font-size="13" fill="#111">
    <defs>
      <marker id="mapping-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
      </marker>
    </defs>
    <text x="90" y="30" text-anchor="middle">(blocks)</text>
    <text x="280" y="30" text-anchor="middle">(threads)</text>
    <text x="470" y="30" text-anchor="middle">CPU cores</text>
    <line x1="135" y1="25" x2="225" y2="25" stroke="#111" stroke-width="1.3" marker-end="url(#mapping-arrow)"/>
    <line x1="330" y1="25" x2="415" y2="25" stroke="#111" stroke-width="1.3" marker-end="url(#mapping-arrow)"/>
    <line x1="90" y1="42" x2="90" y2="82" stroke="#111" stroke-width="1.3" marker-end="url(#mapping-arrow)"/>
    <line x1="280" y1="42" x2="280" y2="82" stroke="#111" stroke-width="1.3" marker-end="url(#mapping-arrow)"/>
    <text x="90" y="102" text-anchor="middle">we decide</text>
    <text x="280" y="102" text-anchor="middle">JVM / OS</text>
    <text x="280" y="122" text-anchor="middle">decides</text>
  </svg>
  <figcaption>Diagram: blocks are mapped to threads, and threads to CPU cores</figcaption>
</figure>
<p>Mapping can be static or dynamic. Since the work here is <u>equal</u> across all tasks, static mapping is chosen.</p>
<figure class="diagram">
  <svg viewBox="0 0 560 200" width="100%" style="max-width:160mm" xmlns="http://www.w3.org/2000/svg" font-family="Georgia" font-size="13" fill="#111">
    <defs>
      <pattern id="mapping-hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
        <line x1="0" y1="0" x2="0" y2="22" stroke="#111" stroke-width="1"/>
      </pattern>
    </defs>
    <text x="60" y="35" text-anchor="middle">P0</text>
    <rect x="90" y="18" width="220" height="26" fill="url(#mapping-hatch)" stroke="#111" stroke-width="1.3"/>
    <text x="60" y="80" text-anchor="middle">P1</text>
    <rect x="90" y="63" width="220" height="26" fill="url(#mapping-hatch)" stroke="#111" stroke-width="1.3"/>
    <text x="60" y="120" text-anchor="middle">…</text>
    <text x="60" y="170" text-anchor="middle">P7</text>
    <rect x="90" y="153" width="220" height="26" fill="url(#mapping-hatch)" stroke="#111" stroke-width="1.3"/>
    <path d="M330,18 Q345,18 345,40 L345,88 Q345,98 357,98 Q345,98 345,108 L345,157 Q345,179 330,179" fill="none" stroke="#111" stroke-width="1.3"/>
    <text x="370" y="94">all equal</text>
    <text x="370" y="112">amount of work</text>
  </svg>
  <figcaption>Diagram: threads P0 to P7 each given an equal block of work</figcaption>
</figure>
